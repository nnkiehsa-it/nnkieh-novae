:auto;flex:1;padding:0 10px 16px}.nav details{margin-top:6px}.nav summary{padding:10px 6px;font-weight:600;cursor:pointer}.nav summary span{float:right;color:var(--muted);font-size:12px;font-weight:400;margin-right:6px}.nav button{display:block;text-align:left;width:100%;border-color:transparent;padding:9px 10px;line-height:1.5;margin:2px 0}.nav button.active{background:var(--wash);border-color:#c6d7f6}.nav .code{display:block;font-size:11px;color:var(--muted);font-family:Consolas,monospace;overflow-wrap:anywhere}.nav-footer{padding:12px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}.work{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{padding:12px 16px 10px;background:white;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button{border:0;background:transparent}.tabs button.active{background:var(--wash);color:var(--accent)}.flow-head{display:flex;gap:12px;align-items:flex-start}.flow-head p{margin-top:4px;font-size:12px;color:var(--muted);max-width:76ch}.flow-meta{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}.panel{min-height:0;flex:1;display:none}.panel.active{display:flex}.graph-panel{position:relative;flex-direction:column}.stage{flex:1;min-height:220px;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:#f6f8fb;background-image:radial-gradient(#ccd4df .7px,transparent .7px);background-size:20px 20px}.stage.dragging{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0}.edges{position:absolute;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#8392a5;stroke-width:1.6}.edge.async{stroke:#687780;stroke-dasharray:6 5}.edge-label{font-size:11px;fill:#4d5b6e;paint-order:stroke;stroke:#f6f8fb;stroke-width:5px;stroke-linejoin:round}.node{position:absolute;width:250px;height:148px;text-align:left;border:1px solid #bfcbd8;border-radius:12px;padding:14px;background:white;display:flex;flex-direction:column;gap:8px;overflow:hidden}.node:hover{background:#fff;border-color:#648ac8}.node.active{border:2px solid var(--accent);padding:13px;background:#f3f7ff;color:var(--ink)}.node-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.step-num{font-variant-numeric:tabular-nums;min-width:20px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#547698}.node[data-layer=database] .dot{background:#97672d}.node[data-layer=async] .dot{background:#456a58}.node h3{font-size:15px}.node .excerpt{font-size:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.graph-bottom{background:white;border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.graph-bottom .hint{color:var(--muted);font-size:12px}.zoom-controls{position:absolute;bottom:14px;left:16px;display:flex;gap:4px;background:white;border:1px solid var(--line);padding:4px;border-radius:10px}.zoom-controls button{border:0;min-width:36px;padding:4px 9px}.legend{position:absolute;top:12px;left:16px;display:flex;gap:14px;color:var(--muted);font-size:11px;pointer-events:none}.legend>span{display:flex;gap:5px;align-items:center}.inspector{background:white;border-left:1px solid var(--line);min-height:0;overflow:auto;padding:20px}.inspector .step-label{color:var(--muted);font-size:12px;margin-bottom:8px}.inspector h2{margin-bottom:12px}.inspector h3{margin-top:24px;margin-bottom:7px}.inspector .body{line-height:1.85;white-space:pre-line;overflow-wrap:anywhere}.source-link{display:block;text-align:left;font-family:Consolas,monospace;font-size:11px;border:0;border-radius:5px;color:var(--accent);padding:6px 0;overflow-wrap:anywhere;min-height:32px;width:100%}.source-link:hover{text-decoration:underline;background:transparent}.note{margin-top:10px;font-size:12px;line-height:1.75;color:#4f5c69}.reading-panel{overflow:auto;padding:20px;display:none;flex-direction:column;gap:1 color:var(--muted)}.snapshot-info{font-size:12px;line-height:1.7;margin:0 0 18px;padding:12px 0;border-bottom:1px solid var(--line)}.counts{display:flex;gap:8px;flex-wrap:wrap}.reading-panel details{margin:18px 0}.reading-panel summary{font-weight:600;cursor:pointer;padding:10px 0}.top-actions{margin-left:auto}.top-actions button{font-size:12px}.coverage-note{color:#586570;font-size:12px;line-height:1.8}.flow-counter{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
@media(max-width:1150px){.layout{grid-template-columns:230px minmax(0,1fr) 285px}.inspector{padding:16px}.legend{gap:8px}.legend span:last-child{display:none}header .sub{max-width:420px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}}
@media(max-width:900px){.layout{grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 230px}.sidebar{grid-row:1/3}.inspector{grid-column:2;grid-row:2;border-left:0;border-top:1px solid var(--line);padding:14px 18px}.inspector h3{margin-top:14px}.inspector h2{font-size:17px;margin-bottom:6px}.inspector .body{font-size:13px}.work{grid-column:2;grid-row:1}.top-actions .snapshot{display:none}.focus-mode .layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}.focus-mode .work{grid-column:1}.flow-head p{max-height:42px;overflow:auto}}
@media(max-width:600px){.app{grid-template-rows:62px minmax(0,1fr)}header{padding:10px 12px;gap:10px}h1{font-size:17px}header .sub{font-size:11px;max-width:260px}.layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 225px}.work{grid-column:1}.inspector{grid-column:1}.sidebar{display:none;position:fixed;z-index:10;top:62px;left:0;bottom:0;width:min(320px,88vw);box-shadow:8px 0 24px #24344a24}.menu-open .sidebar{display:flex}.mobile-menu{display:block;font-size:12px}.toolbar{padding:10px 12px}.tabs{gap:0;justify-content:space-between;margin-bottom:8px}.tabs button{font-size:12px;padding:6px 8px}.flow-head h2{font-size:17px}.flow-head p{font-size:11px;max-height:35px;overflow:auto}.flow-meta{margin-top:7px}.flow-meta .badge{font-size:11px}.stage{min-height:160px}.graph-bottom{padding:7px 12px;gap:6px}.graph-bottom .hint{display:none}.legend{top:8px;left:12px;font-size:11px}.zoom-controls{bottom:10px;left:10px}.reading-panel{padding:14px}.top-actions{display:none}.setting-top{flex-wrap:wrap}.source-line{font-size:11px}.line-no{width:44px;padding:0 8px}.focus-mode .work{grid-column:1}.focus-mode .inspector{display:none}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .12s,border-color .12s}.source-line.highlight{animation:highlight-in .3s ease-out}@keyframes highlight-in{from{background:#d7e6ff}to{background:#edf3ff}}}

<body>
<div class="app" id="app">
<header><button class="mobile-menu" id="menuToggle" aria-expanded="false">流程目錄</button><div><h1>Novae 程式流程地圖</h1><div class="sub" id="versionLine"></div></div><div class="row top-actions"><span class="badge snapshot">離線原碼快照</span><button id="focusButton" aria-pressed="false">專注地圖</button></div></header>
<div class="layout">
<aside class="sidebar" aria-label="流程目錄"><div class="search-box"><label for="search">搜尋操作、資料表、設定或檔名</label><input id="search" type="search" placeholder="例如：附議、cron、圖片…" autocomplete="off"></div><nav class="nav" id="nav"></nav><div class="nav-footer" id="navFooter"></div></aside>
<main class="work">
<div class="toolbar"><div class="tabs" role="tablist" aria-label="閱讀方式"><button role="tab" aria-selected="true" class="active" data-tab="graph">流程地圖</button><button role="tab" aria-selected="false" data-tab="settings">設定影響</button><button role="tab" aria-selected="false" data-tab="inventory">完整盤點</button><button role="tab" aria-selected="false" data-tab="sources">原碼索引</button></div><div class="flow-head"><div><h2 id="flowTitle"></h2><p id="flowSummary"></p></div></div><div class="flow-meta" id="flowMeta"></div></div>
<section id="graphPanel" class="panel graph-panel active" role="tabpanel" aria-label="流程地圖"><div class="stage" id="stage" tabindex="0" aria-label="可拖曳、滾輪縮放的流程圖；使用加減鍵縮放，0置中，左右鍵切換步驟"><div class="legend"><span><i class="dot"></i>瀏覽器 / Worker</span><span><i class="dot" style="background:#97672d"></i>資料庫</span><span><i class="dot" style="background:#456a58"></i>背景工作</span><span>虛線：非同步</span></div><div class="world" id="world"></div><div class="zoom-controls" aria-label="縮放工具"><button id="zoomOut" aria-label="縮小">−</button><button id="zoomLabel" title="回到100%">100%</button><button id="zoomIn" aria-label="放大">+</button><button id="fitButton">全圖</button><button id="currentButton">目前步驟</button></div></div><div class="graph-bottom"><button id="previous">上一步</button><span class="flow-counter" id="stepCount"></span><button id="next">下一步</button><div class="spacer"></div><span class="hint">拖空白移動 · 滾輪縮放 · 點卡片看解說</span><button id="allSteps">逐步閱讀</button></div></section>
<section id="settingsPanel" class="panel reading-panel" role="tabpanel" aria-label="設定影響"></section>
<section id="inventoryPanel" class="panel reading-panel" role="tabpanel" aria-label="完整盤點"></section>
<section id="sourcesPanel" class="panel reading-panel" role="tabpanel" aria-label="原碼索引"></section>
<section id="codePanel" class="panel source-panel" aria-label="原碼快照"><div class="source-header"><button id="codeBack">回原碼索引</button><button id="copyPath">複製路徑</button><strong id="codeTitle"></strong><input id="codeSearch" type="search" placeholder="搜尋此檔原碼"><button id="codeFind">找下一處</button><span class="small muted" id="codeHint"></span></div><div class="source-code" id="codeLines" tabindex="0"></div></section>
</main>
<aside class="inspector" id="inspector" aria-label="步驟解說" aria-live="polite"></aside>
</div></div>
<script>
'use strict';
const DATA = /*__PROJECT_DATA__*/;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const layerNames={browser:'瀏覽器',worker:'Cloudflare Worker',database:'PostgreSQL',async:'非同步工作'};
let current=DATA.flows[0],selected=0,activeTab='graph',sourcePath='',sourceLine=1,readingAll=false;
let scale=1,tx=0,ty=0,worldW=0,worldH=0,pan=null,pointers=new Map(),pinch=null;
const positions=[];
function refHTML(ref){return '<button class="source-link" data-source="'+esc(ref.path)+'" data-line="'+ref.line+'">'+esc(ref.path)+':'+ref.line+'</button>'}
function targetButton(id,label='檢視流程'){return '<button data-flow="'+esc(id)+'">'+esc(label)+'</button>'}
function searchable(f){return [f.title,f.id,f.summary,...f.nodes.map(n=>n.title+' '+n.text+' '+n.refs.map(r=>r.path).join(' '))].join(' ').toLowerCase()}
const searchIndex=new Map(DATA.flows.map(f=>[f.id,searchable(f)]));
function renderNav(){const query=$('search').value.trim().toLowerCase();let count=0;const blocks=DATA.groups.map(group=>{const items=DATA.flows.filter(f=>f.group===group&&(!query||searchIndex.get(f.id).includes(query)));count+=items.length;if(!items.length)return '';return '<details '+(group===current.group||query||group==='先看全貌'?'open':'')+'><summary>'+esc(group)+'<span>'+items.length+'</span></summary>'+items.map(f=>'<button data-flow="'+esc(f.id)+'" class="'+(f.id===current.id?'active':'')+'" '+(f.id===current.id?'aria-current="page"':'')+'>'+esc(f.title)+(f.rateGroup?'<span class="code">'+esc(f.id)+'</span>':'')+'</button>').join('')+'</details>'}).join('');$('nav').innerHTML=blocks||'<p class="empty">沒有符合的操作。試試「到期」「通知」或 action 名稱。</p>';$('navFooter').textContent=count+' 個流程 · '+DATA.meta.actionCount+' / '+DATA.meta.actionCount+' actions 已對照 registry。搜尋也會篩選設定與原碼。'}
function selectFlow(id){const flow=DATA.flows.find(f=>f.id===id);if(!flow)return;current=flow;selected=0;readingAll=false;document.body.classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false');renderNav();renderFlow();setTab('graph');try{localStorage.setItem('novae-flow-map:last',id)}catch{}}
function renderFlow(){$('flowTitle').textContent=current.title;$('flowSummary').textContent=current.summary;$('flowMeta').innerHTML='<span class="badge">'+esc(current.group)+'</span><span class="badge">'+current.nodes.length+' 步</span>'+(current.rateGroup?'<span class="badge mono">'+esc(current.id)+'</span><span class="badge">'+esc(current.rateGroup)+'</span>':'')+'<span class="small muted">'+(current.timing?esc(current.timing):'點卡片檢視完整解說與來源')+'</span>';renderGraph();renderInspector();requestAnimationFrame(initialView)}
function renderGraph(){positions.length=0;const cols=current.nodes.length<=4?2:4,stepX=294,stepY=214;current.nodes.forEach((n,i)=>{const row=Math.floor(i/cols),col=row%2?cols-1-i%cols:i%cols;positions.push({x:30+col*stepX,y:42+row*stepY,w:250,h:148})});worldW=cols*stepX+40;worldH=Math.ceil(current.nodes.length/cols)*stepY+20;let lines='';for(const e of current.edges){const a=positions[e.from],b=positions[e.to];let sx,sy,ex,ey,d,lx,ly;if(Math.abs(a.y-b.y)<1){const right=b.x>a.x;sx=a.x+(right?a.w:0);sy=a.y+a.h/2;ex=b.x+(right?0:b.w);ey=b.y+b.h/2;const bend=(sx+ex)/2;d='M'+sx+','+sy+' C'+bend+','+sy+' '+bend+','+ey+' '+ex+','+ey;lx=bend;ly=sy-10}else if(Math.abs(a.x-b.x)<1){sx=a.x+a.w/2;sy=a.y+a.h;ex=b.x+b.w/2;ey=b.y;const bend=(sy+ey)/2;d='M'+sx+','+sy+' C'+sx+','+bend+' '+ex+','+bend+' '+ex+','+ey;lx=sx+38;ly=bend}else{sx=a.x+a.w/2;sy=a.y+a.h;ex=b.x+b.w/2;ey=b.y+b.h;const lane=Math.max(sy,ey)+24+(e.to%3)*10;d='M'+sx+','+sy+' L'+sx+','+lane+' L'+ex+','+lane+' L'+ex+','+ey;lx=(sx+ex)/2;ly=lane-7}lines+='<path class="edge '+(e.async?'async':'')+'" d="'+d+'" marker-end="url(#arrow)"/><text class="edge-label" x="'+lx+'" y="'+ly+'" text-anchor="middle">'+esc(e.label)+'</text>'}const cards=current.nodes.map((n,i)=>'<button class="node '+(i===selected?'active':'')+'" data-node="'+i+'" data-layer="'+n.layer+'" style="left:'+positions[i].x+'px;top:'+positions[i].y+'px" aria-label="步驟'+(i+1)+' '+esc(n.title)+'" aria-pressed="'+(i===selected)+'"><span class="node-top"><span class="step-num">'+(i+1)+'</span><i class="dot"></i>'+esc(layerNames[n.layer])+'</span><h3>'+esc(n.title)+'</h3><span class="excerpt">'+esc(n.text)+'</span></button>').join('');$('world').style.width=worldW+'px';$('world').style.height=worldH+'px';$('world').innerHTML='<svg class="edges" width="'+worldW+'" height="'+worldH+'" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8392a5"/></marker></defs>'+lines+'</svg>'+cards}
function renderInspector(){const n=current.nodes[selected];$('stepCount').textContent=(selected+1)+' / '+current.nodes.length;$('previous').disabled=selected===0;$('next').disabled=selected===current.nodes.length-1;const nodes=readingAll?current.nodes:[n];$('inspector').innerHTML=(readingAll?'<h2>逐步閱讀</h2>':'')+nodes.map((item,i)=>'<div class="step-label">步驟 '+(readingAll?i+1:selected+1)+' · '+esc(layerNames[item.layer])+'</div><h2>'+esc(item.title)+'</h2><p class="body">'+esc(item.text)+'</p><h3>對照原碼</h3>'+(item.refs.length?item.refs.map(refHTML).join(''):'<p class="small muted">此步驟是介面行為說明；後續步驟有對應原碼。</p>')+(readingAll?'<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">':'')).join('')+(current.notes?.length?'<h3>生效時機與注意點</h3>'+current.notes.map(note=>'<p class="note">'+esc(note)+'</p>').join(''):'');$('allSteps').classList.toggle('active',readingAll)}
function selectNode(index,focus=false){selected=Math.max(0,Math.min(current.nodes.length-1,index));readingAll=false;document.querySelectorAll('.node').forEach((el,i)=>{el.classList.toggle('active',i===selected);el.setAttribute('aria-pressed',String(i===selected))});renderInspector();$('inspector').scrollTop=0;if(focus){const p=positions[selected],r=$('stage').getBoundingClientRect();tx=r.width/2-(p.x+p.w/2)*scale;ty=r.height/2-(p.y+p.h/2)*scale;transform()}}
function transform(){$('world').style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';$('zoomLabel').textContent=Math.round(scale*100)+'%'}
function fit(){if(activeTab!=='graph')return;const r=$('stage').getBoundingClientRect();scale=Math.max(.16,Math.min(1.08,(r.width-28)/worldW,(r.height-65)/worldH));tx=(r.width-worldW*scale)/2;ty=(r.height-worldH*scale)/2;transform()}
function initialView(){if(activeTab!=='graph')return;const r=stage.getBoundingClientRect(),p=positions[selected];if(!p||!r.width||!r.height)return;scale=1;tx=r.width/2-(p.x+p.w/2);ty=56-p.y;transform()}
function zoom(factor,x,y){const r=$('stage').getBoundingClientRect();x??=r.width/2;y??=r.height/2;const next=Math.max(.12,Math.min(2.8,scale*factor));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform()}
function setTab(tab){activeTab=tab;document.querySelectorAll('.tabs button').forEach(b=>{const yes=b.dataset.tab===(tab==='code'?'sources':tab);b.classList.toggle('active',yes);b.setAttribute('aria-selected',String(yes))});document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(tab==='code'?'codePanel':tab+'Panel').classList.add('active');if(tab==='graph')requestAnimationFrame(initialView);if(tab==='settings')renderSettings();if(tab==='inventory')renderInventory();if(tab==='sources')renderSources()}
function renderSettings(){const q=$('search').value.trim().toLowerCase(),items=DATA.settings.filter(s=>!q||JSON.stringify(s).toLowerCase().includes(q));let previous='';$('settingsPanel').innerHTML='<h2>設定改了，哪裡會變？</h2><p class="coverage-note">所有數值是程式初值，這次沒有讀取正式資料庫。編輯 draft 尚未生效；DB 提交、背景 job 完成、其他已開啟裝置更新各有自己的時機。</p>'+items.map(s=>{const heading=s.section!==previous?'<h3 class="section-title">'+esc(s.section)+'</h3>':'';previous=s.section;return heading+'<article class="setting"><div class="setting-top"><strong>'+esc(s.title)+'</strong><span class="spacer"></span>'+targetButton(s.target)+'</div><code>'+esc(s.key)+'</code><p><span class="label">存在：</span>'+esc(s.store)+'</p>'+(s.initial!==undefined?'<p><span class="label">初值：</span>'+esc(s.initial)+'　<span class="label">可調：</span>'+esc(s.range)+'</p>':'')+'<p><span class="label">影響：</span>'+esc(s.effect)+'</p><p><span class="label">生效：</span>'+esc(s.timing)+'</p><details><summary>來源與使用處</summary>'+s.refs.map(refHTML).join('')+'</details></article>'}).join('')+(items.length?'':'<p class="empty">目前搜尋沒有符合的設定。</p>')}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function renderInventory(){const q=$('search').value.trim().toLowerCase();const actions=DATA.flows.filter(f=>f.rateGroup&&(!q||searchIndex.get(f.id).includes(q)));$('inventoryPanel').innerHTML='<h2>完整盤點與證據範圍</h2><div class="snapshot-info"><p>版本 <code>'+esc(DATA.meta.head)+'</code><br>建立於 '+esc(DATA.meta.date)+'（臺北）</p><p>'+esc(DATA.meta.scope)+'。盤點涵蓋已註冊 action、特殊入口、實際 route、現存 DB triggers 與程式時間條件；同一家族共享的畫面操作會集中解說。原碼中未暴露的 helper 不當成使用者按鈕。</p><p>更新方式：在專案執行 <code>'+esc(DATA.meta.regenerate)+'</code>。新增 action／政策沒有解說時，產生器會拒絕產出，提醒補上檔案。</p></div><div class="counts"><span class="badge">'+DATA.meta.actionCount+' actions</span><span class="badge">'+DATA.meta.flowCount+' 流程</span><span class="badge">'+DATA.settings.length+' 設定列</span><span class="badge">'+DATA.meta.triggerCount+' 現存 triggers</span><span class="badge">'+DATA.meta.sourceCount+' 原碼檔</span></div><h3 class="section-title">一般 API 操作：逐項對照 registry</h3>'+table(['操作','類別 / 權限','流程'],actions.map(f=>[esc(f.id)+'<br>'+esc(f.title),esc(f.rateGroup)+'<br>'+esc(f.permission||'domain handler 授權'),targetButton(f.id,'逐步檢視')]))+'<h3 class="section-title">特殊入口</h3>'+table(['路徑 / method','作用','流程'],DATA.endpoints.map(([route,method,desc,target])=>['<code>'+esc(route)+'</code><br>'+esc(method),esc(desc),targetButton(target)]))+'<details><summary>前端 route 與 @sheet 原碼（'+DATA.routes.length+'）</summary>'+table(['Route','型別','原碼'],DATA.routes.map(r=>['/'+esc(r.route).replace(/^\//,''),r.sheet?'平行 / 攔截詳情':'一般page',r.refs.map(refHTML).join('')]))+'</details><details><summary>現在仍存在的 DB triggers（'+DATA.triggers.length+'）</summary><p class="coverage-note">依 migration CREATE/DROP 的順序盤點，已移除的舊 outbox/realtime/audit triggers 不列入。函式最新定義需在對應後續 migration 檢視；資料庫部署是否套齊未實測。</p>'+table(['table / trigger','自動做什麼','建立來源'],DATA.triggers.filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q)).map(t=>['<code>'+esc(t.table)+'</code><br>'+esc(t.name),esc(t.description)+'<br><code>'+esc(t.func)+'</code>',t.refs.map(refHTML).join('')]))+'</details><details><summary>時間／排程／到期原碼索引（'+DATA.timers.length+' 處）</summary><p class="coverage-note">包含技術用逾時、token、動畫短暫回饋等；這是原碼索引，主要業務時間已在左側「時間與自動」逐步解釋。</p>'+table(['來源','時間條件原碼'],DATA.timers.filter(t=>!q||(t.path+' '+t.text).toLowerCase().includes(q)).map(t=>[refHTML(t),'<code>'+esc(t.text)+'</code>']))+'</details>'}
function filePurpose(p){if(p.startsWith('src/app/'))return 'Next 路由與殼層';if(p.startsWith('src/components/ui/'))return '共用視覺元件';if(p.startsWith('src/components/'))return '畫面與互動';if(p.startsWith('src/hooks/'))return '狀態與流程 orchestration';if(p.startsWith('src/services/'))return '瀏覽器 I/O';if(p.startsWith('src/lib/'))return '快取、請求、格式等 helper';if(p.startsWith('src/i18n/'))return '語言與文案';if(p.includes('/backend/actions/'))return 'Worker action';if(p.includes('/backend/events/'))return '事件對映';if(p.includes('/backend/jobs/'))return 'Queue 工作';if(p.includes('/backend/shared/'))return 'Worker 外部服務／政策 helper';if(p.includes('/durable/'))return 'Durable Object';if(p.startsWith('database/'))return '資料庫 schema 演進';if(p.startsWith('config/'))return '生成器來源設定';if(p.startsWith('scripts/'))return '開發、驗證與部署工具';if(p.startsWith('.github/'))return '遠端 workflow';return '型別、契約與設定'}
function renderSources(){const q=$('search').value.trim().toLowerCase(),entries=Object.keys(DATA.sources).filter(p=>!q||p.toLowerCase().includes(q)||DATA.sources[p].text.toLowerCase().includes(q));$('sourcesPanel').innerHTML='<h2>這次 review 的原碼快照</h2><p class="coverage-note">檔案內嵌在此 HTML，離線也能讀。此快照不會隨專案自動變更；需重跑產生器。沒有包含 .env、憑證、正式資料與 seed。'+entries.length+' 個檔案符合目前搜尋。</p>'+entries.map(p=>'<div class="file-row">'+refHTML({path:p,line:1})+'<span class="small muted">'+esc(filePurpose(p))+'</span></div>').join('')}
function showSource(p,line=1){if(!DATA.sources[p])return;sourcePath=p;sourceLine=line;$('codeTitle').textContent=p;$('codeSearch').value='';$('codeHint').textContent=DATA.sources[p].note||('SHA-256 '+(DATA.sources[p].sha256||'').slice(0,12));setTab('code');drawCode();requestAnimationFrame(()=>scrollCode(line))}
function drawCode(){const q=$('codeSearch').value,lower=q.toLowerCase();$('codeLines').innerHTML=DATA.sources[sourcePath].text.split('\n').map((text,i)=>{const index=q?text.toLowerCase().indexOf(lower):-1;const rendered=index>=0?esc(text.slice(0,index))+'<mark>'+esc(text.slice(index,index+q.length))+'</mark>'+esc(text.slice(index+q.length)):esc(text);return '<div class="source-line '+(i+1===sourceLine?'highlight':'')+'" id="source-line-'+(i+1)+'"><span class="line-no">'+(i+1)+'</span><span>'+rendered+'</span></div>'}).join('')}
function scrollCode(line){const el=$('source-line-'+line);if(el)$('codeLines').scrollTop=Math.max(0,el.offsetTop-$('codeLines').offsetTop-80)}
function findCode(){const q=$('codeSearch').value.toLowerCase();if(!q)return;const lines=DATA.sources[sourcePath].text.split('\n'),matches=lines.map((v,i)=>v.toLowerCase().includes(q)?i+1:0).filter(Boolean);if(!matches.length){$('codeHint').textContent='找不到此文字';return}sourceLine=matches.find(i=>i>sourceLine)||matches[0];drawCode();scrollCode(sourceLine);$('codeHint').textContent=matches.indexOf(sourceLine)+1+' / '+matches.length+' 處'}
document.addEventListener('click',e=>{const source=e.target.closest('[data-source]');if(source){showSource(source.dataset.source,Number(source.dataset.line)||1);return}const flow=e.target.closest('[data-flow]');if(flow){selectFlow(flow.dataset.flow);return}const node=e.target.closest('[data-node]');if(node){selectNode(Number(node.dataset.node));return}const tab=e.target.closest('[data-tab]');if(tab)setTab(tab.dataset.tab)});
$('search').addEventListener('input',()=>{renderNav();if(activeTab==='settings')renderSettings();if(activeTab==='inventory')renderInventory();if(activeTab==='sources')renderSources()});
$('previous').onclick=()=>selectNode(selected-1,true);$('next').onclick=()=>selectNode(selected+1,true);$('allSteps').onclick=()=>{readingAll=!readingAll;renderInspector()};$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('fitButton').onclick=fit;$('currentButton').onclick=initialView;$('zoomLabel').onclick=()=>zoom(1/scale);$('focusButton').onclick=()=>{const yes=$('app').classList.toggle('focus-mode');$('focusButton').textContent=yes?'顯示目錄與解說':'專注地圖';$('focusButton').setAttribute('aria-pressed',String(yes));requestAnimationFrame(initialView)};$('menuToggle').onclick=()=>{$('menuToggle').setAttribute('aria-expanded',String(document.body.classList.toggle('menu-open')))};
$('codeBack').onclick=()=>setTab('sources');$('codeFind').onclick=findCode;$('codeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')findCode()});$('copyPath').onclick=async()=>{try{await navigator.clipboard.writeText(DATA.meta.repo+'/'+sourcePath);$('copyPath').textContent='已複製';setTimeout(()=>$('copyPath').textContent='複製路徑',1200)}catch{$('codeHint').textContent='請選取上方路徑複製'}};
const stage=$('stage');stage.addEventListener('wheel',e=>{if(e.target.closest('.zoom-controls'))return;e.preventDefault();const r=stage.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.002),e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.zoom-controls'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);if(pointers.size===2){const[a,b]=[...pointers.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y)};pan=null}else pan={x:e.clientX,y:e.clientY,tx,ty};stage.classList.add('dragging')});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const[a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=stage.getBoundingClientRect();zoom(d/pinch.distance,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.distance=d}else if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;transform()}});function endPointer(e){pointers.delete(e.pointerId);pinch=null;pan=null;stage.classList.remove('dragging')}stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);stage.addEventListener('keydown',e=>{if(e.target!==stage)return;const keys={'+':()=>zoom(1.2),'=':()=>zoom(1.2),'-':()=>zoom(1/1.2),'0':fit,ArrowRight:()=>selectNode(selected+1,true),ArrowLeft:()=>selectNode(selected-1,true)};if(keys[e.key]){e.preventDefault();keys[e.key]()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false')}});new ResizeObserver(()=>{if(activeTab==='graph')initialView()}).observe(stage);
$('versionLine').textContent='程式快照 '+DATA.meta.head.slice(0,8)+' · '+DATA.meta.date+' · 所有數值為初值';
renderNav();renderFlow();
// 便於有限度的交付驗證，不發任何 API 請求。
window.projectMap={data:DATA,selectFlow,setTab,showSource,get view(){return {current:current.id,selected,scale,tx,ty,activeTab}}};
</script>
