version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      frameworks:
        patterns:
          - next
          - "@next/*"
          - react
          - react-dom
          - "@types/react*"
          - "framework7*"
          - serwist
          - "@serwist/*"
          - tailwindcss
          - "@tailwindcss/*"
        update-types: [minor, patch]
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
          - esbuild
        update-types: [minor, patch]
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node 的型別主版本隨 .node-version 一起升級。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
