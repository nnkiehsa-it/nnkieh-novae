name: Backup Neon Database

on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

concurrency:
  group: neon-database-backup
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Read administrator backup policy
        id: policy
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node scripts/backup-policy.mjs

      - name: Determine whether the backup is due
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_INTERVAL_HOURS: ${{ steps.policy.outputs.backupIntervalHours }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_created_at="$(
            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("novae-neon-")) | .created_at' \
              | sort -r \
              | head -n 1
          )"
          if [ -z "$latest_created_at" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_epoch="$(date --date="$latest_created_at" +%s)"
          current_epoch="$(date -u +%s)"
          if (( current_epoch - latest_epoch >= BACKUP_INTERVAL_HOURS * 3600 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "Latest backup is within the configured interval: $latest_created_at"
          fi

      - name: Validate backup configuration
        if: steps.cadence.outputs.run == 'true'
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo 'NEON_DATABASE_URL is required in the production environment.' >&2
            exit 1
          fi
          if ! [[ "$BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo 'BACKUP_AGE_RECIPIENT must be a valid age public recipient.' >&2
            exit 1
          fi

      - name: Create a PostgreSQL 18 logical backup
        if: steps.cadence.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          mkdir -p backup
          docker run --rm \
            --env DATABASE_URL \
            --volume "$PWD/backup:/backup" \
            postgres:18-alpine \
            sh -ceu 'pg_dump "$DATABASE_URL" --format=custom --compress=9 --no-owner --no-privileges --file=/backup/novae.dump'

      - name: Encrypt the backup before upload
        if: steps.cadence.outputs.run == 'true'
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          age --recipient "$BACKUP_AGE_RECIPIENT" --output backup/novae.dump.age backup/novae.dump
          rm -f backup/novae.dump
          sha256sum backup/novae.dump.age > backup/novae.dump.age.sha256

      - name: Upload encrypted backup artifact
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: novae-neon-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup/novae.dump.age
            backup/novae.dump.age.sha256
          if-no-files-found: error
          retention-days: ${{ steps.policy.outputs.backupRetentionDays }}

      - name: Keep the configured number of database backups
        if: steps.cadence.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_COPIES: ${{ steps.policy.outputs.backupCopies }}
        run: |
          mapfile -t artifact_ids < <(
            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("novae-neon-")) | [.created_at, (.id | tostring)] | @tsv' \
              | sort -r \
              | cut -f2
          )
          for artifact_id in "${artifact_ids[@]:$BACKUP_COPIES}"; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
