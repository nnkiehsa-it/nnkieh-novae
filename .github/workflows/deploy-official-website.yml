name: Deploy Official Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-official-website.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: official-website-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install website dependencies
        run: npm ci --prefix website
      - name: Build bilingual static website
        env:
          GITHUB_PAGES_BASE: /novae/
        run: npm run build --prefix website
      - name: Disable Jekyll processing
        run: touch website/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
