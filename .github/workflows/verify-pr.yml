name: Verify Changes

on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloudflare/**'
      - 'database/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'components.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'tsconfig*.json'
      - 'vercel.json'
      - 'vitest.integration.config.ts'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'cloudflare/**'
      - 'database/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'components.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'tsconfig*.json'
      - 'vercel.json'
      - 'vitest.integration.config.ts'
      - '.github/workflows/**'

permissions:
  checks: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$HEAD_SHA^"
          fi
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          backend=false
          browser=false
          if printf '%s\n' "$files" | grep -Eq '^(cloudflare/|database/|config/|tests/integration/|scripts/(configure-|database\.mjs|external-provider-test-server\.mjs|render-worker-config\.mjs|verify-integration\.mjs|generate-(api-errors|backend-actions|data-retention|rate-limits|all)\.mjs)|(?:package\.json|bun\.lock)$|tsconfig\.integration\.json$|vitest\.integration\.config\.ts$)'; then
            backend=true
          fi
          if printf '%s\n' "$files" | grep -Eq '^(src/app/|src/components/|src/hooks/|src/lib/|src/services/|src/styles/|public/|next\.config\.mjs$|tests/e2e/|(?:package\.json|bun\.lock)$|scripts/(generate-harmonyos-subset|check-build-budget|generate-all)\.mjs)'; then
            browser=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  fast:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated configuration is committed
        run: bun run verify:generated

      - name: Run fast verification
        run: bun run verify:fast

  backend:
    needs: [changes, fast]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Firebase Emulator cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-15.24.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify backend types and integration behavior
        run: |
          bun run check:worker
          bun run check:integration-types
          bun run verify:integration

  browser:
    needs: [changes, fast]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Firebase Emulator cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-15.24.0

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-browser-${{ hashFiles('bun.lock', 'next.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-browser-${{ hashFiles('bun.lock', 'next.config.mjs') }}-
            ${{ runner.os }}-node24-next-browser-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for browser E2E
        run: bunx playwright install --with-deps chromium

      - name: Verify real browser journeys
        run: bun run test:e2e

      - name: Verify production asset budget
        run: bun run check:build-budget
