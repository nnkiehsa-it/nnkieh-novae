name: Verify PR

on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloudflare/**'
      - 'database/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'components.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'tsconfig*.json'
      - 'vercel.json'
      - 'vitest.integration.config.ts'
      - '.github/workflows/**'

permissions:
  checks: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Verify generated configuration is committed
        run: |
          npm run generate:all
          git diff --exit-code

      - name: Verify frontend, Worker, architecture, and dependencies
        run: npm run verify:local

      - name: Verify database, permissions, actions, jobs, and realtime
        run: npm run verify:integration

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Verify real browser journeys
        run: npm run test:e2e
