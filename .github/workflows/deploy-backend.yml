name: Deploy Neon and Cloudflare Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'cloudflare/**'
      - 'database/**'
      - 'config/**'
      - 'scripts/configure-database-runtime.mjs'
      - 'scripts/configure-cloudinary.mjs'
      - 'scripts/database.mjs'
      - 'scripts/generate-*.mjs'
      - 'scripts/render-worker-config.mjs'
      - 'scripts/verify-integration.mjs'
      - 'tests/integration/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.integration.json'
      - 'vitest.integration.config.ts'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
      CLOUDFLARE_QUEUE_NAME: ${{ vars.CLOUDFLARE_QUEUE_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Verify generated contracts and backend types
        run: |
          npm run generate:all
          git diff --exit-code
          npm run check:worker
          npm run check:integration-types
          npm run test:architecture

      - name: Verify database, permissions, actions, jobs, and realtime locally
        run: npm run verify:integration

      - name: Validate deployment configuration
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALLOWED_DOMAIN: ${{ secrets.ALLOWED_DOMAIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_RUNTIME_PASSWORD: ${{ secrets.NEON_RUNTIME_PASSWORD }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REALTIME_TICKET_SECRET: ${{ secrets.REALTIME_TICKET_SECRET }}
        run: |
          missing=()
          for name in \
            ADMIN_EMAILS \
            ALLOWED_DOMAIN \
            ALLOWED_ORIGINS \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_WORKER_URL \
            CLOUDINARY_API_KEY \
            CLOUDINARY_API_SECRET \
            CLOUDINARY_CLOUD_NAME \
            FIREBASE_PROJECT_ID \
            FIREBASE_WEB_API_KEY \
            GOOGLE_SERVICE_ACCOUNT_JSON \
            HEALTHCHECK_SECRET \
            MEDIA_SIGNING_SECRET \
            NEON_DATABASE_URL \
            NEON_RUNTIME_PASSWORD \
            REALTIME_TICKET_SECRET; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing backend deployment values: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if { [ -n "$NOTION_TOKEN" ] && [ -z "$NOTION_DATABASE_ID" ]; } || \
             { [ -z "$NOTION_TOKEN" ] && [ -n "$NOTION_DATABASE_ID" ]; }; then
            echo 'NOTION_TOKEN and NOTION_DATABASE_ID must both be set or both be omitted.' >&2
            exit 1
          fi
          if [ -n "$NOTION_DATA_SOURCE_ID" ] && \
             { [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DATABASE_ID" ]; }; then
            echo 'NOTION_DATA_SOURCE_ID requires NOTION_TOKEN and NOTION_DATABASE_ID.' >&2
            exit 1
          fi

      - name: Apply forward-only Neon migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:migrate

      - name: Configure the least-privilege Worker database role
        env:
          DATABASE_RUNTIME_PASSWORD: ${{ secrets.NEON_RUNTIME_PASSWORD }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:configure-runtime

      - name: Configure the Cloudinary authenticated upload preset
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        run: node scripts/configure-cloudinary.mjs

      - name: Validate Hyperdrive binding
        env:
          CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          if ! [[ "$CLOUDFLARE_HYPERDRIVE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo 'CLOUDFLARE_HYPERDRIVE_ID must be a 32-character hexadecimal ID.' >&2
            exit 1
          fi

      - name: Render environment-specific Worker configuration
        env:
          NOTION_ENABLED: ${{ secrets.NOTION_TOKEN != '' && 'true' || 'false' }}
        run: node scripts/render-worker-config.mjs --environment "$DEPLOYMENT_ENVIRONMENT" --output /tmp/novae-wrangler.json

      - name: Ensure the Cloudflare Queue exists
        run: |
          if [ -n "$CLOUDFLARE_QUEUE_NAME" ]; then
            queue_name="$CLOUDFLARE_QUEUE_NAME"
          elif [ "$DEPLOYMENT_ENVIRONMENT" = "production" ]; then
            queue_name='novae-jobs'
          else
            queue_name="novae-jobs-${DEPLOYMENT_ENVIRONMENT}"
          fi
          if ! npx wrangler queues info "$queue_name" --config /tmp/novae-wrangler.json >/dev/null 2>&1; then
            npx wrangler queues create "$queue_name" --config /tmp/novae-wrangler.json
          fi

      - name: Create the ephemeral Worker secrets file
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALLOWED_DOMAIN: ${{ secrets.ALLOWED_DOMAIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REALTIME_TICKET_SECRET: ${{ secrets.REALTIME_TICKET_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const secrets = {
            ADMIN_EMAILS: process.env.ADMIN_EMAILS,
            ALLOWED_DOMAIN: process.env.ALLOWED_DOMAIN,
            ALLOWED_ORIGINS: process.env.ALLOWED_ORIGINS,
            CLOUDINARY_API_KEY: process.env.CLOUDINARY_API_KEY,
            CLOUDINARY_API_SECRET: process.env.CLOUDINARY_API_SECRET,
            CLOUDINARY_CLOUD_NAME: process.env.CLOUDINARY_CLOUD_NAME,
            FIREBASE_PROJECT_ID: process.env.FIREBASE_PROJECT_ID,
            FIREBASE_WEB_API_KEY: process.env.FIREBASE_WEB_API_KEY,
            GOOGLE_SERVICE_ACCOUNT_JSON: process.env.GOOGLE_SERVICE_ACCOUNT_JSON,
            HEALTHCHECK_SECRET: process.env.HEALTHCHECK_SECRET,
            MEDIA_SIGNING_SECRET: process.env.MEDIA_SIGNING_SECRET,
            NOTION_DATABASE_ID: process.env.NOTION_DATABASE_ID,
            NOTION_DATA_SOURCE_ID: process.env.NOTION_DATA_SOURCE_ID,
            NOTION_TOKEN: process.env.NOTION_TOKEN,
            PUBLIC_API_URL: process.env.CLOUDFLARE_WORKER_URL,
            REALTIME_TICKET_SECRET: process.env.REALTIME_TICKET_SECRET,
          };
          for (const key of Object.keys(secrets)) {
            if (!secrets[key]) delete secrets[key];
          }
          writeFileSync('/tmp/novae-worker-secrets.json', JSON.stringify(secrets), { mode: 0o600 });
          NODE

      - name: Deploy the Cloudflare Worker
        run: npx wrangler deploy --config /tmp/novae-wrangler.json --secrets-file /tmp/novae-worker-secrets.json

      - name: Remove ephemeral deployment secrets
        if: always()
        run: rm -f /tmp/novae-worker-secrets.json

      - name: Smoke test authentication and database health
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
        run: |
          origin="${ALLOWED_ORIGINS%%,*}"
          for attempt in $(seq 1 12); do
            unauthorized="$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' \
              -X POST "${CLOUDFLARE_WORKER_URL%/}/v1/actions" \
              -H 'content-type: application/json' -H "origin: $origin" \
              --data '{"action":"getCurrentUserRole","payload":{}}')"
            health="$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              -X POST "${CLOUDFLARE_WORKER_URL%/}/v1/actions" \
              -H 'content-type: application/json' -H "origin: $origin" \
              -H "x-healthcheck-secret: $HEALTHCHECK_SECRET" \
              --data '{"action":"healthcheck","payload":{}}')"
            if [ "$unauthorized" = '401' ] && [ "$health" = '200' ] && grep -q '"ok":true' /tmp/health.json; then
              exit 0
            fi
            sleep 5
          done
          printf 'Worker smoke test failed (auth=%s health=%s): %s\n' "$unauthorized" "$health" "$(cat /tmp/health.json)" >&2
          exit 1
